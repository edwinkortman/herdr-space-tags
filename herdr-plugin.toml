id = "herdr-space-tags"
name = "Herdr Space Tags"
version = "0.9.0"
min_herdr_version = "0.9.0"
description = "Tag workspaces and group the spaces sidebar by tag."
platforms = ["linux", "macos"]

# Workspace tokens live on the server and are not restored after a restart,
# so every kept tag is re-reported once the session is back.
[[startup]]
command = ["python3", "space_tags.py", "startup"]

# Dock the sidebar in the focused tab when the session comes back.
[[startup]]
command = ["python3", "sidebar.py", "ensure"]

# A workspace opened for a project that was tagged before adopts its tag, and
# label rules are re-evaluated when a workspace is renamed.
[[events]]
on = "workspace.created"
command = ["python3", "space_tags.py", "workspace-created"]

[[events]]
on = "workspace.renamed"
command = ["python3", "space_tags.py", "workspace-renamed"]

# A group header sits on the first space of a block, so it has to follow
# manual moves, regroupings and closes.
[[events]]
on = "workspace.moved"
command = ["python3", "space_tags.py", "sync-bands"]

# Keep a sidebar docked in whatever tab the user is looking at.
[[events]]
on = "tab.focused"
command = ["python3", "sidebar.py", "ensure"]

[[events]]
on = "tab.created"
command = ["python3", "sidebar.py", "ensure"]

[[events]]
on = "workspace.focused"
command = ["python3", "sidebar.py", "ensure"]

[[events]]
on = "workspace.reordered"
command = ["python3", "space_tags.py", "sync-bands"]

[[events]]
on = "workspace.closed"
command = ["python3", "space_tags.py", "sync-bands"]

[[actions]]
id = "tag"
title = "Space tags: tag this space"
contexts = ["workspace"]
command = ["python3", "space_tags.py", "tag"]

[[actions]]
id = "untag"
title = "Space tags: clear this space's tag"
contexts = ["workspace"]
command = ["python3", "space_tags.py", "untag"]

[[actions]]
id = "regroup"
title = "Space tags: regroup spaces by tag"
contexts = ["global"]
command = ["python3", "space_tags.py", "regroup"]

[[actions]]
id = "apply"
title = "Space tags: refresh tags on open spaces"
contexts = ["global"]
command = ["python3", "space_tags.py", "apply"]

[[panes]]
id = "picker"
title = "Tag space"
placement = "popup"
width = "60%"
height = 12
command = ["python3", "space_tags.py", "picker"]

# The stand-alone sidebar: a left-docked pane that renders the tag-grouped
# spaces list and the agents list, so the native sidebar can stay hidden.
[[panes]]
id = "sidebar"
title = "Spaces"
placement = "split"
command = ["python3", "sidebar.py", "run"]

[[actions]]
id = "sidebar"
title = "Spaces sidebar: open or close"
contexts = ["global"]
command = ["python3", "sidebar.py", "toggle"]

[[actions]]
id = "sidebar-close"
title = "Spaces sidebar: close"
contexts = ["global"]
command = ["python3", "sidebar.py", "close"]
