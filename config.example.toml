# Herdr Space Tags — example configuration.
#
# Copy this file to the plugin config directory and edit it:
#   herdr plugin config-dir herdr-space-tags
#   cp config.example.toml "$(herdr plugin config-dir herdr-space-tags)/config.toml"
#
# After editing, re-tag open spaces:
#   herdr plugin action invoke herdr-space-tags.apply

# Sidebar group order, top to bottom. Tags not listed here follow
# alphabetically; untagged spaces always stay last.
order = ["work", "personal", "home"]

# "first" (default) shows a tag once, on the first space of its block, so the
# sidebar reads as sections. Use "each" to label every tagged space.
band = "first"

# Length of the coloured rule under a group title, in characters. 0 disables
# it. Keep it within the sidebar width; longer rules are clipped with an
# ellipsis.
border_width = 24

# A space is tagged when its label or cwd matches one of the patterns.
# The first matching rule in the file wins.
[[rule]]
tag = "work"
labels = ["acme-*", "atlas", "core-*", "billing"]
cwds = ["~/code/acme/*"]

[[rule]]
tag = "personal"
labels = ["garden-*", "photo-dump", "notes"]

# Label patterns are globs (* and ?) matched case-insensitively, so
# "TELESCOPE-*" below also matches a space called "telescope-archive".
[[rule]]
tag = "home"
labels = ["thermostat", "doorbell-*", "TELESCOPE-*"]
